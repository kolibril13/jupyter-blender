schema_version = "1.0.0"

id = "jupyter_blender"
version = "0.1.11"
name = "Jupyter"
tagline = "Jupyter notebooks running inside Blender's Python interpreter"
maintainer = "Jan-Hendrik Müller"
type = "add-on"

website = "https://github.com/kolibril13/jupyter-blender"

tags = ["Development", "System"]

blender_version_min = "5.1.0"

license = [
    "SPDX:AGPL-3.0-or-later",
]
copyright = [
    "2025 jupyter-blender Contributors",
]

# Must be a table of short reasons (<= 64 chars); the older list form is
# rejected by Blender 5.x's manifest parser.
# * files   — install site-packages dependencies via pip/uv
# * network — Jupyter notebook server binds to a local TCP port
[permissions]
files = "Install Jupyter Python dependencies into site-packages"
network = "Run a local JupyterLab server on a local TCP port"
